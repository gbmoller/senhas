<script>
function enviar(tipo) {
  const nome = document.getElementById("nome").value.trim();
  const cpf  = document.getElementById("cpf").value.trim();
  const msg  = document.getElementById("msg");

  if (!nome || nome.length < 2) {
    msg.innerHTML = "❌ Informe seu nome.";
    return;
  }

  if (!cpf || cpf.length !== 11) {
    msg.innerHTML = "❌ Informe um CPF válido (11 números).";
    return;
  }

  msg.innerHTML = "⏳ Aguarde...";

  fetch("https://script.google.com/macros/s/AKfycbxijP6K36ntCundxxtJA8A4c1oHqHsC_2l5q8p-4fuxM4JC5GpH2y_BHWsEJJ-fx7m1/exec", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ nome, cpf, tipo })
  })
  .then(r => r.json())
  .then(res => {
    if (res.status === "ok") {
      msg.innerHTML = `
        <strong>✅ Senha retirada</strong><br>
        Nome: ${res.nome}<br>
        Número: ${res.numero}<br>
        Tipo: ${res.tipo}<br>
        Código: ${res.codigo}
      `;
    } else if (res.status === "cheio") {
      msg.innerHTML = "❌ As senhas de hoje já se encerraram.";
    } else if (res.status === "ja_usado") {
      msg.innerHTML = "⚠️ Este CPF já retirou senha hoje.";
    } else {
      msg.innerHTML = "❌ Não foi possível retirar a senha.";
    }
  })
  .catch(() => {
    msg.innerHTML = "❌ Erro de comunicação. Tente novamente.";
  });
}
</script>


<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Retirada de Senhas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
      text-align: center;
    }

    .box {
      background: #ffffff;
      max-width: 420px;
      margin: auto;
      padding: 20px;
      border-radius: 12px;
    }

    input, button {
      box-sizing: border-box;
      width: 95%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
    }

    button {
      background: #1f7a8c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .pref {
      background: #6a1b9a;
    }

    #msg {
      margin-top: 20px;
      font-size: 16px;
      line-height: 1.5;
    }

    .versao {
      color: red;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Retirada de Senhas</h2>

  <!-- Apenas o nome é solicitado -->
  <input
    id="nome"
    type="text"
    placeholder="Nome completo"
    autocomplete="name"
    maxlength="150"
  >

  <button class="botao-senha" onclick="enviar('N')">
    Senha Comum
  </button>

  <button class="pref botao-senha" onclick="enviar('P')">
    Senha Preferencial
  </button>

  <div id="msg" role="status" aria-live="polite"></div>
</div>

<script>
const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyjY2YRaVArdZOVV0-gCmwwcgUD7am6RVfasMIb99nWOKE83LnFbsWl-3-o7KSNX4Fj/exec";

let enviando = false;

function enviar(tipo) {
  // Impede dois cliques simultâneos na mesma página
  if (enviando) return;

  const nome = document.getElementById("nome").value.trim();
  const msg = document.getElementById("msg");
  const botoes = document.querySelectorAll(".botao-senha");

  // Validação apenas do nome
  if (nome.length < 2) {
    msg.textContent = "Por favor, informe seu nome.";
    return;
  }

  if (tipo !== "N" && tipo !== "P") {
    msg.textContent = "Tipo de senha inválido.";
    return;
  }

  enviando = true;
  botoes.forEach(botao => botao.disabled = true);

  msg.textContent = "Aguarde, estamos gerando sua senha...";

  // Envia somente nome e tipo, sem CPF
  const url = new URL(SCRIPT_URL);
  url.searchParams.append("nome", nome);
  url.searchParams.append("tipo", tipo);

  fetch(url.toString())
    .then(response => {
      if (!response.ok) {
        throw new Error("Falha na comunicação.");
      }
      return response.json();
    })
    .then(res => {
      if (res.status === "ok") {
        // Montagem segura do resultado
        msg.replaceChildren();

        const titulo = document.createElement("strong");
        titulo.textContent = "Sua senha foi gerada";

        const detalhes = document.createElement("div");
        detalhes.style.marginTop = "15px";

        const linhas = [
          ["Nome", res.nome],
          ["Número", res.numero],
          ["Tipo", res.tipo],
          ["Código", res.codigo]
        ];

        linhas.forEach(([rotulo, valor]) => {
          const linha = document.createElement("div");
          linha.textContent = `${rotulo}: ${valor}`;
          detalhes.appendChild(linha);
        });

        const aviso = document.createElement("p");
        aviso.textContent = "Apresente esta senha na chegada.";

        msg.appendChild(titulo);
        msg.appendChild(detalhes);
        msg.appendChild(aviso);

      } else if (res.status === "cheio") {
        msg.textContent =
          "As senhas de hoje já se encerraram. Agradecemos a compreensão.";

      } else if (res.status === "erro") {
        msg.textContent =
          res.mensagem || "Erro ao gerar senha.";

      } else {
        msg.textContent =
          "Não foi possível gerar a senha.";
      }
    })
    .catch(error => {
      console.error("Erro ao gerar senha:", error);

      msg.textContent =
        "Erro de conexão. Confira se a senha foi registrada antes de tentar novamente.";
    })
    .finally(() => {
      enviando = false;
      botoes.forEach(botao => botao.disabled = false);
    });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Retirada de Senhas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
      text-align: center;
    }

    .box {
      background: #ffffff;
      max-width: 420px;
      margin: auto;
      padding: 20px;
      border-radius: 12px;
    }

    input, button {
      width: 95%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
    }

    button {
      background: #1f7a8c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .pref {
      background: #6a1b9a;
    }

    #msg {
      margin-top: 20px;
      font-size: 16px;
    }

    .versao {
      color: red;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Retirada de Senhas</h2>

  <input id="nome" placeholder="Nome completo">
  <input id="cpf" placeholder="CPF (somente números)">

  <button onclick="enviar('N')">Senha Comum</button>
  <button class="pref" onclick="enviar('P')">Senha Preferencial</button>

  <div id="msg"></div>
</div>

<script>
function enviar(tipo) {
  alert("CLIQUE FUNCIONOU – tipo: " + tipo);
}
</script>

</body>
</html>
